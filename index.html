<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Single-file browser tools. No build, no backend, no tracking.">
<meta name="color-scheme" content="dark">
<title>tools</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230F1115'/%3E%3Cpath d='M8 10l6 6-6 6' fill='none' stroke='%23E8A849' stroke-width='3'/%3E%3Cpath d='M16 23h9' stroke='%23D7DAE0' stroke-width='3'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0F1115;
  --fg:#D7DAE0;
  --dim:#7C8491;
  --line:#23272F;
  --amber:#E8A849;
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{
  margin:0;min-height:100vh;background:var(--bg);color:var(--fg);
  font:400 15px/1.7 "IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  -webkit-font-smoothing:antialiased;
}
main{max-width:106ch;margin:0 auto;padding:12vh 16px 64px}
a{color:inherit;text-decoration:none}
a:focus-visible{outline:2px solid var(--amber);outline-offset:2px}

h1{margin:0;font-size:inherit;font-weight:600;color:var(--amber)}
.intro{margin:4px 0 40px;color:var(--dim)}

/* tool list: one line per tool: name, description, last updated */
.tools{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.tools li{border-bottom:1px solid var(--line)}
.tools a{display:grid;grid-template-columns:24ch 1fr auto;column-gap:3ch;padding:8px 1ch;margin:0 -1ch}
.tools .name{color:var(--fg);font-weight:600;overflow-wrap:anywhere}
.tools .desc{color:var(--dim)}
.tools .updated{color:var(--dim);font-size:13px;white-space:nowrap;align-self:baseline}
.tools a:hover,.tools a:focus-visible{background:var(--line)}
.tools a:hover .name,.tools a:focus-visible .name{color:var(--amber)}

footer{margin-top:48px;color:var(--dim);font-size:13px}
footer a{color:var(--fg);text-decoration:underline;text-decoration-color:var(--dim);text-underline-offset:3px}
footer a:hover{text-decoration-color:var(--amber)}

@media (max-width:640px){
  body{font-size:14px}
  main{padding-top:48px}
  .tools a{grid-template-columns:1fr auto}
  .tools .desc{grid-column:1 / -1}
  .tools .updated{grid-row:1;grid-column:2}
}
</style>
</head>
<body>
<main>
  <h1>tools</h1>
  <p class="intro">Single-file browser tools. No build step, no backend, no tracking.</p>

  <!-- One <li> per tool, kept in alphabetical order. href is the tool's index.html;
       the <time> date is filled in on every push by .github/workflows/update-dates.yml. -->
  <ul class="tools">
    <li><a href="alpaca-report/index.html"><span class="name">alpaca-report</span><span class="desc">Realized P&amp;L from Alpaca fills, by day and week</span><span class="updated">updated <time datetime="2026-09-26">2026-09-26</time></span></a></li>
  </ul>

  <footer>
    <a href="https://github.com/fbjarkes/tools">github.com/fbjarkes/tools</a> · MIT
  </footer>
</main>
</body>
</html>
